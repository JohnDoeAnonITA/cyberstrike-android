name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Versione
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
            IFS='.' read -r MA MI PA <<< "$V"
            PA="${PA:-0}"
            echo "VERSION_CODE=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.jks
            echo "KEYSTORE=$PWD/ks.jks" >> "$GITHUB_ENV"
          else
            echo "Nessun secret KEYSTORE_B64: verrà generato un keystore di sviluppo."
          fi

      - name: Build APK
        run: bash build.sh "$ANDROID_JAR" "$BUILD_TOOLS"

      - uses: actions/upload-artifact@v4
        with:
          name: cyberstrike-client-apk
          path: cyberstrike-client.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cyberstrike-client.apk
          generate_release_notes: true
          prerelease: true
