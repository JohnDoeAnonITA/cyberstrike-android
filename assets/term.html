<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Terminale</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #term { flex:1 1 auto; min-height:0; background:#000; }
  #bar {
    flex:0 0 46px; display:flex; align-items:center; gap:6px;
    padding:0 6px; background:#0b0d10; border-top:1px solid #232a36;
    overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  }
  #bar button {
    flex:0 0 auto; height:32px; padding:0 11px; border-radius:8px;
    background:#141821; color:#e6eaf0; border:1px solid #263040;
    font-size:13px; font-family:monospace;
  }
  #bar button.on { background:#ff6a3d; color:#120a06; border-color:#ff6a3d; }
  #banner {
    position:fixed; left:0; right:0; top:0; padding:6px; text-align:center;
    font:12px monospace; color:#120a06; background:#f5c451; display:none;
  }
</style>
</head>
<body>
<div id="term"></div>
<div id="banner"></div>
<div id="bar">
  <button data-k="&#27;">ESC</button>
  <button id="ctrl">CTRL</button>
  <button data-k="&#9;">TAB</button>
  <button data-k="&#3;">^C</button>
  <button data-k="&#4;">^D</button>
  <button data-k="&#12;">^L</button>
  <button data-k="&#27;[A">↑</button>
  <button data-k="&#27;[B">↓</button>
  <button data-k="&#27;[C">→</button>
  <button data-k="&#27;[D">←</button>
  <button id="minus">A−</button>
  <button id="plus">A+</button>
</div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var wsUrl = params.get('ws');
  var banner = document.getElementById('banner');

  function say(msg) {
    banner.textContent = msg;
    banner.style.display = 'block';
    if (msg) setTimeout(function () { banner.style.display = 'none'; }, 2600);
  }

  var term = new Terminal({
    fontFamily: 'monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 6000,
    theme: {
      background: '#000000',
      foreground: '#e6eaf0',
      cursor: '#ff6a3d',
      selectionBackground: '#3a241c'
    }
  });

  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();

  var ws = null, ctrl = false, tries = 0, closed = false;

  function sendSize() {
    try { Bridge.resize(term.cols, term.rows); } catch (e) {}
  }

  function connect() {
    if (!wsUrl) { say('URL WebSocket mancante'); return; }
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function () {
      tries = 0;
      sendSize();
      term.focus();
    };

    ws.onmessage = function (ev) {
      var data = ev.data;
      if (typeof data !== 'string') {
        data = new TextDecoder('utf-8').decode(new Uint8Array(data));
      }
      // header di replay: \0{"cursor":N}
      if (data.length && data.charCodeAt(0) === 0) return;
      term.write(data);
    };

    ws.onclose = function () {
      if (closed) return;
      tries = Math.min(tries + 1, 6);
      say('Connessione persa — riconnessione…');
      setTimeout(connect, 400 * tries);
    };

    ws.onerror = function () { /* onclose gestisce il retry */ };
  }

  function send(s) {
    if (ws && ws.readyState === 1) ws.send(s);
  }

  term.onData(function (d) {
    if (ctrl && d.length === 1) {
      var c = d.toUpperCase().charCodeAt(0);
      if (c >= 64 && c < 128) send(String.fromCharCode(c - 64));
      ctrl = false;
      document.getElementById('ctrl').classList.remove('on');
      return;
    }
    send(d);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#bar button[data-k]'), function (b) {
    b.addEventListener('click', function () {
      send(b.getAttribute('data-k'));
      term.focus();
    });
  });

  document.getElementById('ctrl').addEventListener('click', function () {
    ctrl = !ctrl;
    this.classList.toggle('on', ctrl);
  });

  var size = 13;
  document.getElementById('plus').addEventListener('click', function () {
    size = Math.min(24, size + 1); term.options.fontSize = size; fit.fit(); sendSize();
  });
  document.getElementById('minus').addEventListener('click', function () {
    size = Math.max(9, size - 1); term.options.fontSize = size; fit.fit(); sendSize();
  });

  var ro = new ResizeObserver(function () {
    try { fit.fit(); sendSize(); } catch (e) {}
  });
  ro.observe(document.getElementById('term'));
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { fit.fit(); sendSize(); }, 250);
  });

  window.addEventListener('beforeunload', function () {
    closed = true;
    if (ws) try { ws.close(); } catch (e) {}
  });

  connect();
})();
</script>
</body>
</html>
